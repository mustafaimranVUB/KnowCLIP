# Phase I — Knowledge Graph Construction
# Usage: python main.py phase1 --config configs/phase1_kg.yaml

data:
  mimic_root: "${MIMIC_ROOT}"          # e.g. $VSC_SCRATCH/mimic-cxr
  reports_root: "${MIMIC_REPORTS}"      # e.g. $VSC_SCRATCH/mimic-cxr-reports/files
  kg_artifacts_dir: "${VSC_DATA}/knoclip/outputs/KG"

kg_pipeline:
  mrconso_path: "${VSC_DATA}/umls/2025AB/META/MRCONSO.RRF"
  mrsty_path: "${VSC_DATA}/umls/2025AB/META/MRSTY.RRF"
  mrrel_path: "${VSC_DATA}/umls/2025AB/META/MRREL.RRF"
  radgraph_model_type: "modern-radgraph-xl"
  output_dir: "${VSC_DATA}/knoclip/outputs/KG"
  top_k_candidates: 5
  # Stage-2 scispaCy fallback grounding
  # Model installed to $VSC_SCRATCH/scispacy_cache via:
  #   pip install https://s3-us-west-2.amazonaws.com/ai2-s2-scispacy/releases/v0.5.5/en_core_sci_lg-0.5.5.tar.gz \
  #       --target $VSC_SCRATCH/scispacy_cache
  use_scispacy_fallback: true
  scispacy_cache_dir: "${VSC_SCRATCH}/scispacy_cache"
  scispacy_confidence_threshold: 0.85

training:
  seed: 42
  log_dir: "${VSC_DATA}/knoclip/outputs/logs"
