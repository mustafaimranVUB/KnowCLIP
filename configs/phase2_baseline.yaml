# Phase II — Baseline Training (classification only, no KG)
# Usage: python main.py train --config configs/phase2_baseline.yaml

model:
  use_kg: false
  enable_classification: true
  enable_report_generation: false

  visual_encoder:
    backbone_type: "biomedclip"
    image_size: 224
    output_dim: 768
    # For subset runs, freeze the vision backbone to avoid catastrophic forgetting.
    # Set to false when training on the full dataset.
    freeze_backbone: true

  classification_head:
    num_classes: 14
    hidden_dim: 512
    dropout: 0.3
    use_batch_norm: true

data:
  mimic_root: "${VSC_SCRATCH}/mimic-cxr"
  reports_root: "${VSC_DATA}/thesis/data/MIMIC-CXR-RRG_reports/files"
  split_csv: "${VSC_SCRATCH}/mimic-cxr/mimic-cxr-2.0.0-split.csv"
  chexpert_csv: "${VSC_SCRATCH}/mimic-cxr/mimic-cxr-2.0.0-chexpert.csv"
  kg_artifacts_dir: "${VSC_DATA}/thesis/outputs/KG"
  split_strategy: "subset_hash"
  subset_train_ratio: 0.70
  subset_val_ratio: 0.15
  subset_test_ratio: 0.15
  batch_size: 16
  num_workers: 4
  pin_memory: true

training:
  learning_rate: 1.0e-4
  weight_decay: 0.01
  warmup_steps: 1000
  num_epochs: 50
  gradient_clip_norm: 1.0
  # Increase effective batch size when VRAM is limited.
  accumulation_steps: 4
  mixed_precision: true
  early_stopping_patience: 5

  # Imbalance-aware classification settings.
  classification_loss_type: "bce"
  use_pos_weight: true
  max_pos_weight: 30.0
  focal_gamma: 2.0
  focal_alpha: null

  classification_loss_weight: 1.0
  generation_loss_weight: 0.0    # No generation

  seed: 42

  checkpoint_dir: "${VSC_DATA}/thesis/outputs/checkpoints/baseline"
  save_every_n_epochs: 5
  keep_last_n_checkpoints: 1

  log_dir: "${VSC_DATA}/thesis/outputs/logs"
  log_every_n_steps: 100
  eval_every_n_epochs: 1
