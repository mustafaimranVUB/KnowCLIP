# Phase II — Baseline Training (classification only, no KG)
# Usage: python main.py train --config configs/phase2_baseline.yaml

model:
  use_kg: false
  enable_classification: true
  enable_report_generation: false

  visual_encoder:
    backbone_type: "biomedclip"
    image_size: 224
    output_dim: 768
    freeze_backbone: false

  classification_head:
    num_classes: 14
    hidden_dim: 512
    dropout: 0.3
    use_batch_norm: true

data:
  mimic_root: "${MIMIC_ROOT}"
  reports_root: "${MIMIC_REPORTS}"
  split_csv: "${MIMIC_ROOT}/mimic-cxr-2.0.0-split.csv"
  chexpert_csv: "${MIMIC_ROOT}/mimic-cxr-2.0.0-chexpert.csv"
  kg_artifacts_dir: "${VSC_DATA}/knoclip/outputs/KG"
  batch_size: 16
  num_workers: 4
  pin_memory: true

training:
  learning_rate: 1.0e-4
  weight_decay: 0.01
  warmup_steps: 1000
  num_epochs: 30
  gradient_clip_norm: 1.0
  accumulation_steps: 1
  mixed_precision: true
  early_stopping_patience: 5

  classification_loss_weight: 1.0
  generation_loss_weight: 0.0    # No generation

  seed: 42

  checkpoint_dir: "${VSC_DATA}/knoclip/outputs/checkpoints/baseline"
  save_every_n_epochs: 5
  keep_last_n_checkpoints: 3

  log_dir: "${VSC_DATA}/knoclip/outputs/logs"
  log_every_n_steps: 100
  eval_every_n_epochs: 1
