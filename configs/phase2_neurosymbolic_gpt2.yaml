# Phase II — Neuro-Symbolic Training with pretrained GPT-2 decoder (FULL DATASET)
# Usage: python main.py train --config configs/phase2_neurosymbolic_gpt2.yaml
# Kept for backward compatibility with existing scripts/docs.
#
# Optimised — ablation-backed settings (see hydra_phase2_neurosymbolic_gpt2_jpg.yaml for details).

model:
  use_kg: true
  enable_classification: true
  enable_report_generation: true

  visual_encoder:
    backbone_type: "biomedclip"
    image_size: 224
    output_dim: 768
    freeze_backbone: true

  knowledge_encoder:
    num_gat_layers: 2
    hidden_channels: 256
    num_attention_heads: 4
    dropout: 0.1
    num_edge_types: 5
    edge_dim: 64
    input_dim: 768
    output_dim: 768

  fusion_module:
    fusion_type: "cross_attention"
    num_fusion_layers: 2
    num_heads: 8
    hidden_dim: 768
    use_bottleneck: true
    bottleneck_dim: 256
    attention_dropout: 0.1
    projection_dropout: 0.1

  classification_head:
    num_classes: 14
    hidden_dim: 512
    dropout: 0.3
    use_batch_norm: true

  report_generation:
    decoder_type: "gpt2"
    vocab_size: 50257
    max_report_length: 128
    num_decoder_layers: 12
    decoder_dim: 768
    num_decoder_heads: 8
    decoder_ffn_dim: 2048
    decoder_dropout: 0.1
    beam_size: 4
    repetition_penalty: 1.35
    no_repeat_ngram_size: 3
    length_penalty: 1.0
    prompt_prefix: "IMPRESSION:"
    scheduled_sampling_enabled: true
    scheduled_sampling_start_ratio: 1.0
    scheduled_sampling_end_ratio: 0.5
    scheduled_sampling_decay_epochs: 20
    label_smoothing: 0.1

data:
  mimic_root: "${MIMIC_ROOT}"
  reports_root: "${MIMIC_REPORTS}"
  split_csv: "${MIMIC_SPLIT_CSV}"
  chexpert_csv: "${MIMIC_CHEXPERT_CSV}"
  kg_artifacts_dir: "${KG_ARTIFACTS_DIR}"
  report_section_preference: "impression"
  split_strategy: "official"
  image_suffixes: [".jpg", ".jpeg", ".png"]
  enforce_all_labels_per_split: false
  batch_size: 32
  num_workers: 8
  pin_memory: true

training:
  learning_rate: 1.0e-4
  weight_decay: 0.01
  warmup_steps: 1000
  num_epochs: 80
  gradient_clip_norm: 1.0
  accumulation_steps: 4
  mixed_precision: true
  early_stopping_patience: 12

  classification_loss_type: "bce"
  use_pos_weight: true
  max_pos_weight: 30.0
  focal_gamma: 2.0
  focal_alpha: null

  two_stage_training: true
  stage1_epochs: 8
  stage1_classification_weight: 0.0
  stage1_freeze_visual_encoder: true
  stage1_freeze_classification_head: true
  stage1_enable_early_stopping: false
  stage1_early_stopping_patience: null
  reset_best_metric_on_stage2: true

  checkpoint_selection_mode: "classification_priority"
  checkpoint_generation_guard_max_val_gen_loss: null
  generation_debug_samples: 5
  generation_eval_max_samples: 128

  classification_loss_weight: 1.0
  generation_loss_weight: 0.25

  # Balanced multilabel sampler: up-weights rare pathologies during training
  sampler_strategy: "balanced_multilabel"
  sampler_rare_label_power: 1.0
  sampler_max_weight: 10.0

  seed: 42

  checkpoint_dir: "${CHECKPOINT_DIR}"
  save_every_n_epochs: 5
  keep_last_n_checkpoints: 2

  log_dir: "${LOG_DIR}"
  log_every_n_steps: 100
