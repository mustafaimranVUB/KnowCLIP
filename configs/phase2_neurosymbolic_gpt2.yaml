# Phase II — Neuro-Symbolic Training with pretrained GPT-2 decoder
# Usage: python main.py train --config configs/phase2_neurosymbolic_gpt2.yaml
#
# Key differences from phase2_neurosymbolic.yaml:
#   - decoder_type: "gpt2"  (pretrained GPT-2 with cross-attention bridges)
#   - generation_loss_weight: 0.5  (elevated — generation is the primary goal)
#   - checkpoint_selection_mode: "val_loss" (balances cls + gen quality)
#   - beam_size: 4

model:
  use_kg: true
  enable_classification: true
  enable_report_generation: true

  visual_encoder:
    backbone_type: "biomedclip"
    image_size: 224
    output_dim: 768
    freeze_backbone: true

  knowledge_encoder:
    num_gat_layers: 2
    hidden_channels: 256
    num_attention_heads: 4
    dropout: 0.1
    num_edge_types: 5
    edge_dim: 64
    input_dim: 768
    output_dim: 768

  fusion_module:
    fusion_type: "cross_attention"
    num_fusion_layers: 2
    num_heads: 8
    hidden_dim: 768
    use_bottleneck: true
    bottleneck_dim: 256
    attention_dropout: 0.1
    projection_dropout: 0.1

  classification_head:
    num_classes: 14
    hidden_dim: 512
    dropout: 0.3
    use_batch_norm: true

  report_generation:
    decoder_type: "gpt2"
    vocab_size: 50257
    max_report_length: 128
    # num_decoder_layers / decoder_dim / decoder_ffn_dim are ignored for GPT-2
    # (uses pretrained GPT-2's 12-layer / 768-dim architecture).
    num_decoder_layers: 12
    decoder_dim: 768
    num_decoder_heads: 8
    decoder_ffn_dim: 2048
    decoder_dropout: 0.1
    beam_size: 4
    repetition_penalty: 1.35
    no_repeat_ngram_size: 3
    length_penalty: 1.0
    scheduled_sampling_enabled: true
    scheduled_sampling_start_ratio: 1.0
    scheduled_sampling_end_ratio: 0.5
    scheduled_sampling_decay_epochs: 40

data:
  mimic_root: "${VSC_SCRATCH}/mimic-cxr"
  reports_root: "${VSC_DATA}/thesis/data/MIMIC-CXR-RRG_reports/files"
  split_csv: "${VSC_SCRATCH}/mimic-cxr/mimic-cxr-2.0.0-split.csv"
  chexpert_csv: "${VSC_SCRATCH}/mimic-cxr/mimic-cxr-2.0.0-chexpert.csv"
  kg_artifacts_dir: "${VSC_DATA}/thesis/outputs/KG"
  split_strategy: "subset_hash"
  subset_train_ratio: 0.70
  subset_val_ratio: 0.15
  subset_test_ratio: 0.15
  batch_size: 16
  num_workers: 4
  pin_memory: true

training:
  learning_rate: 1.0e-4
  weight_decay: 0.01
  warmup_steps: 1000
  num_epochs: 150
  gradient_clip_norm: 1.0
  accumulation_steps: 4
  mixed_precision: true
  early_stopping_patience: 20

  classification_loss_type: "bce"
  use_pos_weight: true
  max_pos_weight: 30.0
  focal_gamma: 2.0
  focal_alpha: null

  two_stage_training: true
  stage1_epochs: 10
  stage1_classification_weight: 0.0
  stage1_freeze_visual_encoder: true
  stage1_freeze_classification_head: true
  stage1_enable_early_stopping: false
  stage1_early_stopping_patience: null
  reset_best_metric_on_stage2: true

  # Use val_loss so the best checkpoint balances BOTH classification and generation.
  checkpoint_selection_mode: "val_loss"
  checkpoint_generation_guard_max_val_gen_loss: null

  generation_debug_samples: 5

  classification_loss_weight: 1.0
  # Elevated from 0.1 — generation is the primary thesis objective.
  generation_loss_weight: 0.5

  seed: 42

  checkpoint_dir: "${VSC_DATA}/thesis/outputs/checkpoints/neurosymbolic_gpt2"
  save_every_n_epochs: 5
  keep_last_n_checkpoints: 1

  log_dir: "${VSC_DATA}/thesis/outputs/logs"
